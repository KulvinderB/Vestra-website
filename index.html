<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestra Accountants Ltd | Corporate Advisory & Tax Architecture</title>
    <style>
        /* Base styles and premium corporate color variables */
        :root {
            --vestra-dark: #0B111E;
            --vestra-slate: #1E293B;
            --vestra-gold: #C5A880;
            --vestra-text: #475569;
            --vestra-bg: #F8FAFC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            background-color: var(--vestra-bg); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--vestra-dark); 
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Layout elements */
        .ribbon {
            background-color: var(--vestra-dark);
            border-bottom: 1px solid #1e293b;
            color: var(--vestra-gold);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 10px 24px;
            text-align: center;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e2e8f0;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 28px;
            height: 28px;
            background-color: var(--vestra-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(45deg);
            border: 1px solid var(--vestra-gold);
        }
        .logo-text-v { color: white; transform: rotate(-45deg); font-weight: bold; font-size: 11px; }
        .logo-title { font-size: 20px; font-weight: 500; tracking: -0.02em; }
        .logo-title span { color: var(--vestra-gold); font-style: italic; font-family: Georgia, serif; }
        
        nav { display: none; gap: 40px; }
        @media (min-width: 768px) { nav { display: flex; } }
        nav a {
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }
        nav a:hover { color: var(--vestra-dark); }
        
        .btn-header {
            border: 1px solid var(--vestra-dark);
            color: var(--vestra-dark);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 12px 24px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-header:hover { background-color: var(--vestra-dark); color: white; }
        
        /* Hero section components */
        .hero { background-color: white; padding: 80px 24px; border-bottom: 1px solid #e2e8f0; }
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 48px;
            align-items: center;
        }
        @media (min-width: 1024px) { 
            .hero { padding: 100px 24px; }
            .hero-container { grid-template-columns: 7fr 5fr; } 
        }
        .hero-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--vestra-gold); margin-bottom: 16px; display: block; }
        .hero h1 { font-family: Georgia, serif; font-size: 42px; line-height: 1.15; font-weight: 600; margin-bottom: 24px; color: var(--vestra-dark); }
        @media (min-width: 640px) { .hero h1 { font-size: 50px; } }
        .hero h1 span { color: var(--vestra-gold); font-style: italic; font-weight: 400; }
        .hero p { color: var(--vestra-text); font-size: 17px; font-weight: 300; max-width: 550px; margin-bottom: 40px; }
        
        .hero-actions { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 640px) { .hero-actions { flex-direction: row; } }
        
        .btn-primary {
            background-color: var(--vestra-dark);
            color: white;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 16px 32px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-primary:hover { background-color: var(--vestra-gold); }
        .btn-secondary {
            border: 1px solid #e2e8f0;
            color: var(--vestra-dark);
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 16px 32px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-secondary:hover { background-color: #f8fafc; }
        
        /* Stats Grid */
        .stats-matrix {
            background-color: var(--vestra-bg);
            padding: 32px;
            border: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .stat-card { background-color: white; padding: 24px; border: 1px solid #f1f5f9; }
        .stat-num { font-family: Georgia, serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; }
        
        /* Capabilities Grid */
        .section-capabilities { padding: 96px 24px; }
        .section-wrap { max-width: 1200px; margin: 0 auto; }
        .section-header { display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 60px; gap: 24px; }
        @media (min-width: 768px) { .section-header { flex-direction: row; align-items: flex-end; } }
        .section-title h2 { font-family: Georgia, serif; font-size: 32px; font-weight: 600; }
        .section-desc { color: var(--vestra-text); font-size: 14px; font-weight: 300; max-width: 350px; }
        
        .grid-blueprint { display: grid; grid-template-columns: 1fr; border: 1px solid #e2e8f0; background-color: white; }
        @media (min-width: 768px) { .grid-blueprint { grid-template-columns: 1fr 1fr 1fr; } }
        .blueprint-card { padding: 40px; border-bottom: 1px solid #e2e8f0; transition: background-color 0.2s; }
        @media (min-width: 768px) { .blueprint-card { border-bottom: none; border-right: 1px solid #e2e8f0; } .blueprint-card:last-child { border-right: none; } }
        .blueprint-card:hover { background-color: #fafafa; }
        .card-num { color: var(--vestra-gold); font-family: Georgia, serif; font-style: italic; font-size: 20px; margin-bottom: 32px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .card-text { color: var(--vestra-text); font-size: 14px; font-weight: 300; margin-bottom: 24px; }
        .card-list { list-style: none; font-size: 12px; color: #64748b; font-weight: 500; }
        .card-list li { margin-bottom: 8px; }

        /* Office Location Section */
        .section-location { padding: 96px 24px; background-color: white; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .location-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 48px; align-items: center; }
        @media (min-width: 768px) { .location-container { grid-template-columns: 1fr 1fr; } }
        .location-info h2 { font-family: Georgia, serif; font-size: 32px; margin-bottom: 16px; }
        .location-info p { color: var(--vestra-text); font-size: 15px; margin-bottom: 24px; font-weight: 300; }
        .address-box { background-color: var(--vestra-bg); padding: 32px; border: 1px solid #e2e8f0; }
        .address-box h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--vestra-gold); margin-bottom: 12px; }
        .address-box p { color: var(--vestra-dark); font-size: 16px; font-weight: 500; line-height: 1.6; }
        .map-placeholder { background-color: #e2e8f0; height: 300px; width: 100%; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

        /* Corporate Philosophy Banner */
        .philosophy-banner { background-color: var(--vestra-dark); color: white; padding: 96px 24px; }
        .philosophy-container { max-width: 800px; margin: 0 auto; }
        .philosophy-banner h2 { font-family: Georgia, serif; font-size: 36px; line-height: 1.2; font-weight: 400; margin-bottom: 48px; }
        .philosophy-banner h2 span { color: var(--vestra-gold); font-style: italic; }
        .split-row { display: grid; grid-template-columns: 1fr; gap: 48px; border-top: 1px solid #1e293b; padding-top: 48px; }
        @media (min-width: 640px) { .split-row { grid-template-columns: 1fr 1fr; } }
        .split-col h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--vestra-gold); margin-bottom: 12px; }
        .split-col p { color: #94a3b8; font-size: 14px; font-weight: 300; }

        /* Clean Engagement Form layout */
